name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The module supports aws >= 5.0: test the oldest and the newest major.
        aws_provider: ["~> 5.0", "~> 6.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # the module requires >= 1.15 (variable "deprecated" attribute)
          terraform_version: "~1.15"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Pin AWS provider
        run: |
          cat > versions_override.tf <<EOF
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "${{ matrix.aws_provider }}"
              }
            }
          }
          EOF

      - name: Init
        run: terraform init -backend=false -upgrade

      - name: Validate
        run: terraform validate

      - name: Test
        run: terraform test
